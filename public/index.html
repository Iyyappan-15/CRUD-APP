<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1904/1904060.png">
   <title>Student CRUD Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="fade-in">
  <div class="container mt-5">
   <h1 class="text-center text-primary fw-bold mb-4">📘 Student Management System</h1>

   <div class="d-flex justify-content-between align-items-center mb-3">
    <input type="text" id="searchbox" class="form-control w-50" placeholder="🔍 Search by Name">
    <button class="btn btn-info" data-bs-toggle="modal" data-bs-target="#Sadd">➕ Add Student</button>
   </div>

    <table class="table table-bordered table-hover align-middle text-center">
      <thead class="table-dark">
       <tr>
         <th>SI No</th>
          <th>Name</th>
          <th>Age</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Department</th>
          <th>Place</th>
          <th>Action</th>
      </tr>
      </thead>
       <tbody id="Student_Table"></tbody>
    </table>
  </div>

  <div class="modal fade" id="Sadd" tabindex="-1">
  <div class="modal-dialog">
  <div class="modal-content">
  <div class="modal-header bg-primary text-white">
    <h5 class="modal-title">Student Form</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
     <form id="studentform">
            <input type="hidden" id="studentId">
            <div class="mb-3"><input type="number" class="form-control" id="sino" placeholder="SI No" required></div>
            <div class="mb-3"><input type="text" class="form-control" id="name" placeholder="Name" required></div>
            <div class="mb-3"><input type="number" class="form-control" id="age" placeholder="Age" required></div>
            <div class="mb-3"><input type="number" class="form-control" id="phone" placeholder="Phone" required></div>
            <div class="mb-3"><input type="email" class="form-control" id="email" placeholder="Email" required></div>
            <div class="mb-3"><input type="text" class="form-control" id="department" placeholder="Department" required></div>
            <div class="mb-3"><input type="text" class="form-control" id="place" placeholder="Place" required></div>
            <button type="submit" class="btn btn-primary w-100">Save</button>
      </form>
      </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <footer>
  © 2025 CRUD Application | Designed by Iyyappan
</footer>
</body>
</html>
